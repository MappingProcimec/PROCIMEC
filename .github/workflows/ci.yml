name: CI/CD Pipeline - PROCIMEC PCM CLOUD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Security Audit, Type-Check, Lint, Test & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Security Vulnerability Audit (NPM Audit)
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Static Type Checking (TypeScript)
        run: npm run type-check

      - name: Static Code Analysis (ESLint)
        run: npm run lint

      - name: Automated Unit & Integration Tests (Vitest)
        run: npm test

      - name: Full Production Build with PWA Validation (Next.js)
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DISABLE_PWA: 'false'
        run: npm run build
